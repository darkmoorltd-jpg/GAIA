name: gaia_app
description: GAIA - Agricultural Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  camera: ^0.10.5
  video_player: ^2.7.2
  paystack_flutter: ^1.0.0
  supabase_flutter: ^2.0.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  intl: ^0.18.1
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  url_launcher: ^6.2.1
  socket_io_client: ^2.0.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_map: ^6.1.0
  latlong2: ^0.8.1
  pdf: ^3.10.4
  printing: ^5.11.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
